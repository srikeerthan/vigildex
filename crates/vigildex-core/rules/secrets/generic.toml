# Name-keyed rules: a field whose *name* says it holds a credential
# (`LINT_HELPER_TOKEN`, `X-Api-Key`, `DB_PASSWORD`) and whose value is a
# literal rather than a reference. These run after the vendor and URL rules,
# so a recognised token keeps its vendor kind.
#
# Vigildex extensions to the gitleaks shape:
#   names    - regex the field name must match for the rule to apply
#   namesNot - regex that excludes a field name (`TOKEN_FILE`, `API_KEY_URL`)
# A rule with `names` never runs on free text; `scan_text` applies it to the
# `NAME=value` words it finds. `maskStyle = "short"` keeps the last three
# characters only (there is no vendor prefix worth showing); `"full"` hides a
# password completely.

title = "Credentials named by their field"

[[rules]]
id = "authorization-bearer"
maskStyle = "short"
description = "Bearer token"
names = '''(?i)^(?:proxy-)?authorization$'''
regex = '''^(?:Bearer|Token|token)\s+(\S{12,})\s*$'''
secretGroup = 1
[rules.allowlist]
regexes = ['''^\$''', '''^op://''']

[[rules]]
id = "authorization-basic"
maskStyle = "short"
description = "Basic auth credentials"
names = '''(?i)^(?:proxy-)?authorization$'''
regex = '''^Basic\s+(\S{12,})\s*$'''
secretGroup = 1
[rules.allowlist]
regexes = ['''^\$''']

[[rules]]
id = "named-private-key"
maskStyle = "short"
description = "Private key"
names = '''(?i)private[_-]?key'''
namesNot = '''(?i)(?:_file|_path|_url|_uri|_dir|_id|_name|_type|_mode|_format|_header)$'''
regex = '''^(\S{12,})$'''
secretGroup = 1
[rules.allowlist]
regexes = ['''^\$''', '''^op://''', '''^[~./]''', '''://''', '''^\d+$''', '''^(?i:true|false|none|null)$''']

[[rules]]
id = "named-password"
description = "Password"
maskStyle = "full"
names = '''(?i)(?:passw(?:or)?d|(?:^|[_-])(?:pass|pwd)(?:[_-]|$))'''
namesNot = '''(?i)(?:_file|_path|_url|_uri|_dir|_id|_name|_type|_mode|_format|_header|_hash|_salt|_min|_max|_len|_length|_policy|_prompt|_required|_enabled)$'''
regex = '''^(\S{8,})$'''
secretGroup = 1
[rules.allowlist]
regexes = ['''^\$''', '''^op://''', '''^[~./]''', '''://''', '''^\d+$''', '''^(?i:true|false|none|null)$''']

[[rules]]
id = "named-api-key"
maskStyle = "short"
description = "API key"
names = '''(?i)api[_-]?key'''
namesNot = '''(?i)(?:_file|_path|_url|_uri|_dir|_id|_name|_type|_mode|_format|_header|_helper|_env|_var|_source|_required|_enabled|_responses)$'''
regex = '''^(\S{12,})$'''
secretGroup = 1
[rules.allowlist]
regexes = ['''^\$''', '''^op://''', '''^[~./]''', '''://''', '''^\d+$''', '''^(?i:true|false|none|null)$''']

[[rules]]
id = "named-secret"
maskStyle = "short"
description = "Secret"
names = '''(?i)secret'''
namesNot = '''(?i)(?:_file|_path|_url|_uri|_dir|_id|_name|_type|_mode|_format|_header|_env|_var|_source|_required|_enabled|_store|_storage)$'''
regex = '''^(\S{12,})$'''
secretGroup = 1
[rules.allowlist]
regexes = ['''^\$''', '''^op://''', '''^[~./]''', '''://''', '''^\d+$''', '''^(?i:true|false|none|null)$''']

[[rules]]
id = "named-token"
maskStyle = "short"
description = "Token"
names = '''(?i)token'''
namesNot = '''(?i)(?:_file|_path|_url|_uri|_dir|_id|_name|_type|_mode|_format|_header|_env|_var|_source|_required|_enabled|_ttl|_expir[a-z]*|_limit|_count|_budget|_max|_min|_store|_storage|_helper)$'''
regex = '''^(\S{12,})$'''
secretGroup = 1
[rules.allowlist]
regexes = ['''^\$''', '''^op://''', '''^[~./]''', '''://''', '''^\d+$''', '''^(?i:true|false|none|null)$''']
