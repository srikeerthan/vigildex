# Credentials embedded in URLs. `maskStyle = "full"` hides the whole password
# (`postgresql://app:••••@db…`) because a password has no vendor prefix worth
# showing; `"short"` keeps the last three characters only.

title = "Credentials in URLs"

[[rules]]
id = "database-url-password"
description = "Database password"
regex = '''\b((?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|mssql|clickhouse|cockroachdb)://[^\s:/@]+:([^\s@/]+)@[^\s"']*)'''
keywords = ["://"]
secretGroup = 2
maskStyle = "full"
[rules.allowlist]
# A reference in the password slot (`postgres://app:${DB_PASSWORD}@…`) is
# resolved at use time, never a secret.
regexes = ['''^\$''', '''^op://''', '''^%7B''']

[[rules]]
id = "url-password"
description = "URL password"
regex = '''\b([a-z][a-z0-9+.-]*://[^\s:/@]+:([^\s@/]+)@[^\s"']*)'''
keywords = ["://"]
secretGroup = 2
maskStyle = "full"
[rules.allowlist]
regexes = ['''^\$''', '''^op://''', '''^%7B''']

[[rules]]
id = "url-query-credential"
description = "Query credential"
maskStyle = "short"
regex = '''[?&](?:token|access_token|auth_token|api_key|apikey|api-key|key|secret|password|passwd|sig|signature)=([^&\s"'#]{8,})'''
keywords = ["="]
secretGroup = 1
[rules.allowlist]
regexes = ['''^\$''']
