# Vendor token shapes. Written for Vigildex in the gitleaks TOML shape; nothing
# here is copied from another rule set.
#
# Every rule matches on a vendor prefix plus a length class (docs/RULES.md,
# finding policy 9), never on entropy, so the same-shape `FAKE` values in
# `fixtures/` trigger them. `secretGroup` names the capture group that holds
# the token (the whole match when 0); the mask keeps the token's prefix and
# its last three characters, so a rule must capture the whole token.
#
# Fields: id, description (the secret kind shown in titles: "{Kind} in plain
# text"), regex, keywords (cheap substring pre-filter, case-sensitive),
# secretGroup, allowlist.regexes (applied to the captured secret; a match
# suppresses the hit).

title = "Vendor tokens"

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\b(sk-ant-api\d{2}-[A-Za-z0-9_-]{80,})'''
keywords = ["sk-ant-api"]
secretGroup = 1

[[rules]]
id = "anthropic-oauth-token"
description = "Anthropic OAuth token"
regex = '''\b(sk-ant-oat\d{2}-[A-Za-z0-9_-]{60,})'''
keywords = ["sk-ant-oat"]
secretGroup = 1

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\b(sk-or-v1-[a-f0-9]{64})\b'''
keywords = ["sk-or-v1-"]
secretGroup = 1

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''\b(sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{80,})'''
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]
secretGroup = 1

[[rules]]
id = "openai-legacy-api-key"
description = "OpenAI API key"
regex = '''\b(sk-[A-Za-z0-9]{48})\b'''
keywords = ["sk-"]
secretGroup = 1

[[rules]]
id = "github-token"
description = "GitHub token"
# Personal access tokens (ghp), OAuth (gho), user-to-server (ghu),
# server-to-server (ghs) and refresh (ghr) tokens share one shape.
regex = '''\b(gh[pousr]_[A-Za-z0-9]{36})\b'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]
secretGroup = 1

[[rules]]
id = "github-fine-grained-token"
description = "GitHub token"
regex = '''\b(github_pat_[A-Za-z0-9_]{82})\b'''
keywords = ["github_pat_"]
secretGroup = 1

[[rules]]
id = "gitlab-token"
description = "GitLab token"
regex = '''\b(glpat-[A-Za-z0-9_-]{20,})(?:[^A-Za-z0-9_-]|$)'''
keywords = ["glpat-"]
secretGroup = 1

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''\b(AIza[0-9A-Za-z_-]{35})(?:[^0-9A-Za-z_-]|$)'''
keywords = ["AIza"]
secretGroup = 1

[[rules]]
id = "aws-access-key-id"
description = "AWS access key"
regex = '''\b((?:AKIA|ASIA)[0-9A-Z]{16})\b'''
keywords = ["AKIA", "ASIA"]
secretGroup = 1

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''\b(xox[baprs]-[0-9A-Za-z-]{10,})(?:[^0-9A-Za-z-]|$)'''
keywords = ["xoxb-", "xoxa-", "xoxp-", "xoxr-", "xoxs-"]
secretGroup = 1

[[rules]]
id = "stripe-key"
description = "Stripe key"
regex = '''\b([sr]k_(?:live|test)_[0-9A-Za-z]{24,})\b'''
keywords = ["sk_live_", "sk_test_", "rk_live_", "rk_test_"]
secretGroup = 1

[[rules]]
id = "npm-token"
description = "npm token"
regex = '''\b(npm_[A-Za-z0-9]{36})\b'''
keywords = ["npm_"]
secretGroup = 1

[[rules]]
id = "pypi-token"
description = "PyPI token"
regex = '''\b(pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,})(?:[^A-Za-z0-9_-]|$)'''
keywords = ["pypi-AgEIcHlwaS5vcmc"]
secretGroup = 1

[[rules]]
id = "huggingface-token"
description = "Hugging Face token"
regex = '''\b(hf_[A-Za-z0-9]{34})\b'''
keywords = ["hf_"]
secretGroup = 1

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\b(gsk_[A-Za-z0-9]{52})\b'''
keywords = ["gsk_"]
secretGroup = 1

[[rules]]
id = "xai-api-key"
description = "xAI API key"
regex = '''\b(xai-[A-Za-z0-9]{80})\b'''
keywords = ["xai-"]
secretGroup = 1

[[rules]]
id = "perplexity-api-key"
description = "Perplexity API key"
regex = '''\b(pplx-[A-Za-z0-9]{48,})\b'''
keywords = ["pplx-"]
secretGroup = 1

[[rules]]
id = "private-key-block"
description = "Private key"
regex = '''(-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----)'''
keywords = ["PRIVATE KEY"]
secretGroup = 1

[[rules]]
id = "jwt"
description = "JSON Web Token"
regex = '''\b(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})(?:[^A-Za-z0-9_.-]|$)'''
keywords = ["eyJ"]
secretGroup = 1
