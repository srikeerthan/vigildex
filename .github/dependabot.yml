# Keeps the SHA-pinned actions in ci.yml (and, through taiki-e/install-action's
# bundled manifest, cargo-deny and cargo-audit) and the Cargo dependencies
# current. Every PR runs the full CI, including `cargo deny check`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine bumps; major updates still arrive one by one.
      minor-and-patch:
        update-types: ["minor", "patch"]
